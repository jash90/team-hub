[package]
name = "hub-mod-e2e"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hub-core.workspace = true
hub-app.workspace = true
axum.workspace = true
chrono.workspace = true
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ts-rs.workspace = true
# Artifacts: the upload is written to disk as it arrives, and served back with Range support.
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
http-body-util = "0.1"
mime = "0.3"
# JUnit XML. A read-only tree with no DTD support, so entity tricks in a posted file do nothing.
roxmltree = "0.21"

[dev-dependencies]
