[workspace]
members = ["crates/*", "modules/*", "apps/desktop/core"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
rayon = "1"
regex = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
hub-core = { path = "crates/hub-core" }
hub-app = { path = "crates/hub-app" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
