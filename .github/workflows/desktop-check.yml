# Compiles the desktop app's window on the three systems it is released for, and runs its
# tests on Linux. The window's code differs by system (`apps/desktop/src-tauri/src/stage.rs` lays the
# two webviews out one way on Linux and another on macOS and Windows), so a change made on
# one system is at least known to build on the others before a release is cut.
#
# No installer is made, nothing is signed, nothing is published, and no secret is used.
name: 'Desktop: builds on every system'

on:
  push:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/ui/**'
      - 'apps/desktop/core/**'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-latest
          - label: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: check

      # The window embeds the built interface, so there has to be one.
      - name: The app's own interface
        run: |
          npm ci --prefix apps/desktop/ui
          npm run build --prefix apps/desktop/ui

      - name: The window and its tests compile
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --no-run

      # Where they are known to pass. Some of them start a shell, and nobody has run them
      # on the other two systems.
      - name: The window's tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
