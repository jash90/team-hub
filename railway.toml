# Railway: build the Dockerfile, wait for the server to answer before switching to a new
# deployment. The service needs a volume mounted at /data and these variables:
#   TEAM_HUB_BASE_URL     https://${{RAILWAY_PUBLIC_DOMAIN}}
#   TEAM_HUB_SETUP_TOKEN  a secret of your own; asked for once, when the first account is made
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/bootstrap"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
