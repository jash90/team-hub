[package]
name = "hub-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "team-hub"
path = "src/main.rs"

[dependencies]
hub-core.workspace = true
hub-app.workspace = true
hub-mod-github = { path = "../../modules/github" }
hub-mod-wiki = { path = "../../modules/wiki" }
hub-mod-confluence = { path = "../../modules/confluence" }
hub-mod-reports = { path = "../../modules/reports" }
hub-mod-e2e = { path = "../../modules/e2e" }
hub-mod-agents = { path = "../../modules/agents" }
axum.workspace = true
chrono.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
