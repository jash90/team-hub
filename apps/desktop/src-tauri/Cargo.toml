[package]
name = "team-hub-desktop"
description = "The team-hub desktop app: the window over hub-desktop-core."
version = "0.3.0"
edition = "2021"
publish = false

# Not a member of the repository's workspace: it needs the system's WebKit libraries, and
# `cargo test --workspace` has to work on machines without them. Build it from this folder.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hub-desktop-core = { path = "../core" }
serde_json = "1"
# `unstable` is what Tauri calls a window with more than one webview in it: the local
# interface, and the server's own web interface beside it (see `src/stage.rs`).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["sync"] }

# On Linux Tauri stacks a window's webviews one under another; `stage.rs` lays them out
# itself, with the same GTK the window is made of.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
